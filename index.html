<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Ujian Online Terpantau</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; user-select: none; }
    .box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
    input, button { padding: 10px; margin: 8px 0; width: 100%; box-sizing: border-box; }
    button { background: #1976d2; color: white; border: none; cursor: pointer; font-weight: bold; }
    #halaman-ujian, #layar-blokir { display: none; }
    #layar-blokir {
      position: fixed; inset: 0; background: #b71c1c; color: white;
      text-align: center; padding-top: 20%; z-index: 9999;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <!-- 1. FORM LOGIN -->
  <div id="halaman-login" class="box">
    <h2>Login Peserta Ujian</h2>
    <input type="text" id="userId" placeholder="Masukkan User ID (contoh: P001)">
    <input type="password" id="password" placeholder="Masukkan Password">
    <button onclick="mulaiLogin()">Masuk & Mulai Ujian (Fullscreen)</button>
    <p id="status-login" style="color:red;"></p>
  </div>

  <!-- 2. HALAMAN UJIAN -->
  <div id="halaman-ujian" class="box">
    <h3 id="info-peserta"></h3>
    <div id="wadah-soal"></div>
    <button onclick="kirimJawaban()">Selesai & Kirim Jawaban</button>
  </div>

  <!-- 3. LAYAR BLOKIR PELANGGARAN -->
  <div id="layar-blokir">
    <h1>AKSES UJIAN DIHENTIKAN</h1>
    <p id="pesan-blokir"></p>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwMuxMhxJ8DVJoHpAiZb0t8zaViGe6k7smeqgO99toHj7S6Me17LW2djpd5qI1rBnh-Sw/exec";
    let userAktif = "";
    let ujianBerjalan = false;
    let kesempatan = 1;

    async function panggilGAS(payload) {
      const res = await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      return res.json();
    }

    async function mulaiLogin() {
      const userId = document.getElementById("userId").value.trim();
      const password = document.getElementById("password").value.trim();
      document.getElementById("status-login").innerText = "Memverifikasi...";

      const hasil = await panggilGAS({ aksi: "LOGIN", userId, password });
      if (hasil.status !== "success") {
        document.getElementById("status-login").innerText = hasil.pesan;
        return;
      }

      // Aktifkan Fullscreen saat ujian dimulai
      if (document.documentElement.requestFullscreen) {
        await document.documentElement.requestFullscreen().catch(() => {});
      }

      userAktif = userId;
      ujianBerjalan = true;
      document.getElementById("halaman-login").style.display = "none";
      document.getElementById("halaman-ujian").style.display = "block";
      document.getElementById("info-peserta").innerText = `Peserta: ${hasil.nama} (${userId})`;

      // Render Soal
      const wadah = document.getElementById("wadah-soal");
      wadah.innerHTML = hasil.soal.map(s => `
        <div style="margin-bottom:20px;">
          <p><b>${s.no}. ${s.tanya}</b></p>
          <label><input type="radio" name="soal_${s.no}" value="A" style="width:auto;"> A. ${s.a}</label><br>
          <label><input type="radio" name="soal_${s.no}" value="B" style="width:auto;"> B. ${s.b}</label><br>
          <label><input type="radio" name="soal_${s.no}" value="C" style="width:auto;"> C. ${s.c}</label><br>
          <label><input type="radio" name="soal_${s.no}" value="D" style="width:auto;"> D. ${s.d}</label>
        </div>
      `).join("");
    }

    function tanganiPelanggaran(alasan) {
      if (!ujianBerjalan) return;

      if (kesempatan > 0) {
        kesempatan--;
        alert("PERINGATAN! Jangan berpindah tab, keluar fullscreen, atau membuka aplikasi lain. Pelanggaran berikutnya otomatis LOGOUT.");
      } else {
        ujianBerjalan = false;
        document.getElementById("halaman-ujian").style.display = "none";
        document.getElementById("pesan-blokir").innerText = "Akun dikunci. Alasan: " + alasan;
        document.getElementById("layar-blokir").style.display = "block";
        panggilGAS({ aksi: "AUTO_LOGOUT", userId: userAktif, keterangan: alasan });
      }
    }

    // 1. Deteksi pindah tab / minimize
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) tanganiPelanggaran("Pindah tab atau minimize browser");
    });

    // 2. Deteksi klik aplikasi lain
    window.addEventListener("blur", () => {
      tanganiPelanggaran("Jendela browser kehilangan fokus");
    });

    // 3. Deteksi keluar dari mode Fullscreen (tekan ESC)
    document.addEventListener("fullscreenchange", () => {
      if (!document.fullscreenElement && ujianBerjalan) {
        tanganiPelanggaran("Keluar dari mode Fullscreen");
      }
    });

    // 4. Blokir tombol pintasan Inspect Element / Copy
    document.addEventListener("keydown", (e) => {
      if (e.key === "F12" || (e.ctrlKey && e.shiftKey && e.key === "I") || (e.ctrlKey && e.key === "u")) {
        e.preventDefault();
        tanganiPelanggaran("Mencoba membuka Inspect Element / Source Code");
      }
    });

    async function kirimJawaban() {
      ujianBerjalan = false;
      const jawaban = {};
      document.querySelectorAll("input[type=radio]:checked").forEach(el => {
        const no = el.name.replace("soal_", "");
        jawaban[no] = el.value;
      });

      const hasil = await panggilGAS({ aksi: "SUBMIT", userId: userAktif, jawaban });
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      document.getElementById("halaman-ujian").innerHTML = `<h2>Ujian Selesai!</h2><p>Skor Anda: <b>${hasil.skor}</b></p>`;
    }
  </script>
</body>
</html>
