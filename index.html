<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Ujian Online - SMK Negeri 1 Purwoasri</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #1e293b;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* BACKGROUND ANIMASI & PARTIKEL */
    .bg-animated {
      position: fixed;
      inset: -5%;
      width: 110%;
      height: 110%;
      background-image: url('https://lh3.googleusercontent.com/d/1Vo2a5qqGEPQm3XzyB0-qZr9NdBvNtXGX');
      background-size: cover;
      background-position: center;
      z-index: -3;
      animation: kenBurnsDinamis 28s ease-in-out infinite alternate;
    }
    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: -2;
      transition: background 1s ease;
    }
    .bg-overlay.mode-siang {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.45), rgba(30, 58, 138, 0.35));
    }
    .bg-overlay.mode-malam {
      background: linear-gradient(135deg, rgba(6, 11, 25, 0.78), rgba(15, 23, 42, 0.68));
    }
    #canvas-partikel {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }
    @keyframes kenBurnsDinamis {
      0% { transform: scale(1) translate(0px, 0px); }
      50% { transform: scale(1.07) translate(-14px, -9px); }
      100% { transform: scale(1.11) translate(14px, 9px); }
    }

    /* GAYA KARTU JADWAL DI DALAM DIALOG SWEETALERT */
    .swal-kop {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 2px solid #cbd5e1;
      text-align: left;
    }
    .swal-kop img { width: 48px; height: auto; }
    .swal-kop .k1 { font-size: 10px; font-weight: 700; color: #475569; }
    .swal-kop .k2 { font-size: 11px; font-weight: 700; color: #475569; }
    .swal-kop .k3 { font-size: 15px; font-weight: 800; color: #1e3a8a; }

    .grid-jadwal-dialog {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 360px;
      overflow-y: auto;
      padding: 4px 2px;
      text-align: left;
    }

    .kartu-jadwal-item {
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      padding: 13px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      transition: all 0.18s ease;
      cursor: pointer;
    }
    .kartu-jadwal-item:hover {
      border-color: #2563eb;
      background: #eff6ff;
      transform: translateY(-1px);
      box-shadow: 0 5px 14px rgba(37, 99, 235, 0.15);
    }
    .kartu-jadwal-item.selesai-waktu {
      opacity: 0.6;
      background: #f1f5f9;
      cursor: not-allowed;
    }
    .kartu-jadwal-item.selesai-waktu:hover {
      border-color: #cbd5e1;
      background: #f1f5f9;
      transform: none;
      box-shadow: none;
    }

    .status-pill {
      display: inline-block;
      font-size: 10.5px;
      font-weight: 800;
      padding: 2px 9px;
      border-radius: 20px;
      margin-bottom: 4px;
    }
    .pill-aktif { background: #dcfce7; color: #15803d; }
    .pill-tunggu { background: #fef3c7; color: #b45309; }
    .pill-habis { background: #fee2e2; color: #b91c1c; }

    .dialog-input {
      width: 100%;
      padding: 11px 13px;
      margin-bottom: 10px;
      border: 1.5px solid #cbd5e1;
      border-radius: 9px;
      font-size: 14px;
      font-family: inherit;
      user-select: text;
    }
    .dialog-input:focus { outline: none; border-color: #2563eb; }

    .box-mapel-terpilih {
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      border: 1.5px solid #93c5fd;
      border-radius: 10px;
      padding: 10px 13px;
      margin-bottom: 14px;
      text-align: left;
    }

    /* TOMBOL UMUM */
    .btn {
      padding: 11px 15px;
      border: none;
      border-radius: 9px;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary { background: #1d4ed8; color: white; }
    .btn-primary:hover { background: #1e40af; }
    .btn-success { background: #16a34a; color: white; }
    .btn-success:hover { background: #15803d; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-secondary:hover { background: #cbd5e1; }

    /* HALAMAN UJIAN FULLSCREEN */
    #halaman-ujian {
      display: none;
      max-width: 960px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 14px;
      padding: 20px 24px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
    }
    .header-ujian {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 18px;
    }
    .timer-box {
      background: #1e293b;
      color: #f8fafc;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 1px;
    }
    .timer-box.kritis { background: #dc2626; animation: kedip 1s infinite; }
    @keyframes kedip { 50% { opacity: 0.65; } }

    .nav-nomor-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 18px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
    }
    .btn-nomor {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1.5px solid #cbd5e1;
      background: white;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-nomor.aktif { border-color: #2563eb; background: #2563eb; color: white; }
    .btn-nomor.terjawab { background: #16a34a; border-color: #16a34a; color: white; }
    .btn-nomor.aktif.terjawab { box-shadow: 0 0 0 3px #93c5fd; }

    .kartu-soal-siswa {
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      padding: 20px;
      background: #ffffff;
      min-height: 280px;
    }
    .opsi-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 11px 14px;
      margin: 8px 0;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
      background: #f8fafc;
    }
    .opsi-label:hover { border-color: #3b82f6; background: #eff6ff; }
    .opsi-label input { width: auto; margin: 3px 0 0 0; transform: scale(1.2); }

    .media-img { max-width: 100%; max-height: 280px; border-radius: 8px; margin: 8px 0; display: block; }
    .media-audio { width: 100%; max-width: 400px; margin: 8px 0; display: block; }
    .media-video { width: 100%; max-width: 480px; max-height: 280px; border-radius: 8px; margin: 8px 0; display: block; }

    textarea.jawab-uraian {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      user-select: text;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <div class="bg-animated"></div>
  <div id="bg-overlay" class="bg-overlay"></div>
  <canvas id="canvas-partikel"></canvas>

  <!-- HALAMAN MENGERJAKAN UJIAN -->
  <div id="halaman-ujian">
    <div class="header-ujian">
      <div>
        <div id="ujian-nama-mapel" style="font-size:17px; font-weight:800; color:#1e3a8a;">Mata Pelajaran</div>
        <div id="ujian-info-peserta" style="font-size:13px; color:#475569; margin-top:2px;">Peserta</div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <span id="badge-pelanggaran" style="background:#fef3c7; color:#b45309; padding:6px 10px; border-radius:8px; font-size:12px; font-weight:700;">Pelanggaran: 0/2</span>
        <div id="timer-ujian" class="timer-box">00:00:00</div>
      </div>
    </div>

    <div style="font-size:12px; font-weight:700; color:#475569; margin-bottom:6px;">Navigasi Nomor Soal:</div>
    <div id="nav-nomor-soal" class="nav-nomor-grid"></div>

    <div id="wadah-soal-aktif" class="kartu-soal-siswa"></div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:18px; flex-wrap:wrap; gap:10px;">
      <button type="button" class="btn btn-secondary" id="btn-prev-soal" onclick="gantiNomorSoal(indeksSoalAktif - 1)">← Soal Sebelumnya</button>
      <div style="display:flex; gap:10px;">
        <button type="button" class="btn btn-primary" id="btn-next-soal" onclick="gantiNomorSoal(indeksSoalAktif + 1)">Soal Berikutnya →</button>
        <button type="button" class="btn btn-success" id="btn-submit-ujian" onclick="konfirmasiSelesaiUjian()">✔ Selesai & Kirim Jawaban</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwMuxMhxJ8DVJoHpAiZb0t8zaViGe6k7smeqgO99toHj7S6Me17LW2djpd5qI1rBnh-Sw/exec";

    let daftarMapelHariIni = [];
    let mapelTerpilih = null;
    let pesertaAktif = null;
    let daftarSoalUjian = [];
    let jawabanSiswa = {};
    let indeksSoalAktif = 0;
    let jumlahPelanggaran = 0;
    let waktuSelesaiTimestamp = 0;
    let intervalTimer = null;
    let sedangUjian = false;
    let kunciAntiCurangAktif = false;

    const HTML_KOP_DIALOG = `
      <div class="swal-kop">
        <img src="https://lh3.googleusercontent.com/d/1KZZymSyz_c9hLLoV2Rcx5_VrabMre6Db" alt="Logo SMKN 1 Purwoasri">
        <div>
          <div class="k1">PEMERINTAH PROVINSI JAWA TIMUR — DINAS PENDIDIKAN</div>
          <div class="k3">SMK NEGERI 1 PURWOASRI</div>
          <div class="k2">Portal Ujian Berbasis Komputer (CBT)</div>
        </div>
      </div>`;

    // --- ANIMASI PARTIKEL SIANG / MALAM ---
    function inisialisasiAnimasiSuasana() {
      const canvas = document.getElementById("canvas-partikel");
      const overlay = document.getElementById("bg-overlay");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");

      let lebar = canvas.width = window.innerWidth;
      let tinggi = canvas.height = window.innerHeight;
      window.addEventListener("resize", () => {
        lebar = canvas.width = window.innerWidth;
        tinggi = canvas.height = window.innerHeight;
      });

      const jam = new Date().getHours();
      const isMalam = (jam >= 18 || jam < 5);
      overlay.className = isMalam ? "bg-overlay mode-malam" : "bg-overlay mode-siang";

      const partikel = [];
      const jumlah = isMalam ? 40 : 65;
      for (let i = 0; i < jumlah; i++) {
        partikel.push({
          x: Math.random() * lebar,
          y: Math.random() * tinggi,
          r: Math.random() * 2.8 + 1.2,
          vx: (Math.random() - 0.5) * 0.6,
          vy: isMalam ? (Math.random() - 0.5) * 0.5 : (Math.random() * 1.1 + 0.4),
          fase: Math.random() * Math.PI * 2
        });
      }

      function animasi() {
        ctx.clearRect(0, 0, lebar, tinggi);
        for (const p of partikel) {
          p.fase += 0.025;
          if (isMalam) {
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0) p.x = lebar; if (p.x > lebar) p.x = 0;
            if (p.y < 0) p.y = tinggi; if (p.y > tinggi) p.y = 0;
            const alpha = 0.3 + 0.7 * ((Math.sin(p.fase) + 1) / 2);
            ctx.fillStyle = `rgba(254, 240, 138, ${alpha})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r * 1.6, 0, Math.PI * 2);
            ctx.fill();
          } else {
            p.y += p.vy;
            p.x += Math.sin(p.fase) * 0.5;
            if (p.y > tinggi) { p.y = -10; p.x = Math.random() * lebar; }
            ctx.fillStyle = "rgba(255, 255, 255, 0.55)";
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        requestAnimationFrame(animasi);
      }
      animasi();
    }

    window.addEventListener("DOMContentLoaded", () => {
      inisialisasiAnimasiSuasana();
      bukaDialogDaftarUjianHariIni();
    });

    function parseTanggalLokal(str) {
      if (!str) return null;
      const bersih = String(str).trim().replace(' ', 'T');
      const d = new Date(bersih);
      return isNaN(d.getTime()) ? null : d;
    }

    function isHariIni(dateObj) {
      if (!dateObj) return false;
      const now = new Date();
      return dateObj.getFullYear() === now.getFullYear() &&
             dateObj.getMonth() === now.getMonth() &&
             dateObj.getDate() === now.getDate();
    }

    // =====================================================================
    // DIALOG 1: DAFTAR JADWAL UJIAN AKTIF HARI INI
    // =====================================================================
    async function bukaDialogDaftarUjianHariIni() {
      Swal.fire({
        width: '640px',
        allowOutsideClick: false,
        allowEscapeKey: false,
        showConfirmButton: false,
        html: `
          ${HTML_KOP_DIALOG}
          <div style="padding:26px 10px; color:#475569;">
            <div style="font-size:15px; font-weight:700; margin-bottom:6px;">⏳ Memuat Daftar Ujian Aktif Hari Ini...</div>
            <div style="font-size:12.5px;">Mohon tunggu sebentar</div>
          </div>
        `
      });

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ aksi: "GET_MAPEL_AKTIF" })
        });
        const json = await res.json();

        if (json.status !== "success" || !Array.isArray(json.mapel)) {
          return tampilkanDialogGagalJadwal("Gagal memuat jadwal ujian dari server.");
        }

        const sekarang = new Date();
        daftarMapelHariIni = json.mapel.filter(m => {
          const tglMulai = parseTanggalLokal(m.mulai);
          const tglSelesai = parseTanggalLokal(m.selesai);
          if (!tglMulai || !tglSelesai) return true;
          return isHariIni(tglMulai) || isHariIni(tglSelesai) || (sekarang >= tglMulai && sekarang <= tglSelesai);
        });

        daftarMapelHariIni.sort((a, b) => {
          const da = parseTanggalLokal(a.mulai);
          const db = parseTanggalLokal(b.mulai);
          return (da ? da.getTime() : 0) - (db ? db.getTime() : 0);
        });

        const tglText = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        let isiDaftarHTML = "";

        if (daftarMapelHariIni.length === 0) {
          isiDaftarHTML = `
            <div style="text-align:center; padding:28px 16px; background:#f8fafc; border:1.5px dashed #cbd5e1; border-radius:12px; color:#475569;">
              <div style="font-size:30px; margin-bottom:6px;">📭</div>
              <b>Tidak ada jadwal ujian aktif hari ini.</b>
              <div style="font-size:12.5px; margin-top:4px;">Silakan hubungi pengawas atau klik Muat Ulang Jadwal.</div>
            </div>`;
        } else {
          isiDaftarHTML = `<div class="grid-jadwal-dialog">` + daftarMapelHariIni.map((m, idx) => {
            const tMulai = parseTanggalLokal(m.mulai);
            const tSelesai = parseTanggalLokal(m.selesai);
            const jamMulai = String(m.mulai || '').split(' ')[1] || m.mulai;
            const jamSelesai = String(m.selesai || '').split(' ')[1] || m.selesai;

            let pillHTML = `<span class="status-pill pill-aktif">🟢 SEDANG BERLANGSUNG</span>`;
            let clsKartu = "";
            let tombolHTML = `<button type="button" class="btn btn-primary" style="padding:8px 13px; font-size:12.5px;">Pilih Ujian ➔</button>`;

            if (tMulai && sekarang < tMulai) {
              pillHTML = `<span class="status-pill pill-tunggu">🟡 AKAN DIMULAI (${jamMulai})</span>`;
              tombolHTML = `<button type="button" class="btn btn-secondary" style="padding:8px 13px; font-size:12.5px;">Pilih ➔</button>`;
            } else if (tSelesai && sekarang > tSelesai) {
              pillHTML = `<span class="status-pill pill-habis">🔴 WAKTU HABIS</span>`;
              clsKartu = "selesai-waktu";
              tombolHTML = `<span style="font-size:12px; font-weight:700; color:#94a3b8;">Ditutup</span>`;
            }

            return `
              <div class="kartu-jadwal-item ${clsKartu}" onclick="pilihUjianDariDialog(${idx})">
                <div style="flex:1; min-width:210px;">
                  ${pillHTML}
                  <div style="font-size:15.5px; font-weight:800; color:#0f172a;">${m.nama}</div>
                  <div style="font-size:12px; color:#475569; margin-top:3px;">
                    Kode: <b>${m.kode}</b> • Pukul: <b>${jamMulai} – ${jamSelesai} WIB</b>
                  </div>
                </div>
                <div>${tombolHTML}</div>
              </div>`;
          }).join('') + `</div>`;
        }

        Swal.fire({
          width: '650px',
          allowOutsideClick: false,
          allowEscapeKey: false,
          showConfirmButton: false,
          html: `
            ${HTML_KOP_DIALOG}
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px;">
              <span style="font-size:13px; font-weight:800; color:#0f172a;">📅 ${tglText}</span>
              <button type="button" class="btn btn-secondary" style="padding:6px 11px; font-size:12px;" onclick="bukaDialogDaftarUjianHariIni()">
                ↻ Muat Ulang Jadwal
              </button>
            </div>
            <p style="margin:0 0 12px 0; font-size:12.5px; color:#475569; text-align:left;">
              Klik salah satu mata pelajaran di bawah ini untuk membuka dialog login peserta:
            </p>
            ${isiDaftarHTML}
          `
        });

      } catch (err) {
        tampilkanDialogGagalJadwal("Koneksi ke server terputus. Periksa internet Anda.");
      }
    }

    function tampilkanDialogGagalJadwal(pesan) {
      Swal.fire({
        width: '480px',
        allowOutsideClick: false,
        allowEscapeKey: false,
        showConfirmButton: false,
        html: `
          ${HTML_KOP_DIALOG}
          <div style="padding:16px; color:#dc2626; font-weight:600; font-size:14px;">${pesan}</div>
          <button type="button" class="btn btn-primary" onclick="bukaDialogDaftarUjianHariIni()">↻ Coba Lagi</button>
        `
      });
    }

    // =====================================================================
    // DIALOG 2: DIALOG LOGIN SISWA (SETELAH MEMILIH UJIAN)
    // =====================================================================
    function pilihUjianDariDialog(idx) {
      const m = daftarMapelHariIni[idx];
      if (!m) return;

      const tSelesai = parseTanggalLokal(m.selesai);
      if (tSelesai && new Date() > tSelesai) {
        Swal.showValidationMessage('Waktu pelaksanaan untuk ujian ini sudah berakhir!');
        return;
      }

      mapelTerpilih = m;
      bukaDialogLoginSiswa();
    }

    function bukaDialogLoginSiswa() {
      if (!mapelTerpilih) return bukaDialogDaftarUjianHariIni();

      const jamMulai = String(mapelTerpilih.mulai || '').split(' ')[1] || mapelTerpilih.mulai;
      const jamSelesai = String(mapelTerpilih.selesai || '').split(' ')[1] || mapelTerpilih.selesai;

      Swal.fire({
        width: '460px',
        allowOutsideClick: false,
        allowEscapeKey: false,
        showConfirmButton: false,
        html: `
          ${HTML_KOP_DIALOG}
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <button type="button" class="btn btn-secondary" style="padding:6px 11px; font-size:12px;" onclick="bukaDialogDaftarUjianHariIni()">
              ← Ganti Ujian
            </button>
            <span style="font-size:12px; font-weight:800; color:#1e3a8a;">Dialog Login Peserta</span>
          </div>

          <div class="box-mapel-terpilih">
            <div style="font-size:10.5px; font-weight:700; color:#1e40af; text-transform:uppercase;">Mata Pelajaran Dipilih:</div>
            <div style="font-size:15.5px; font-weight:800; color:#0f172a; margin:2px 0;">${mapelTerpilih.nama} (${mapelTerpilih.kode})</div>
            <div style="font-size:12px; color:#334155;">⏰ Pukul: <b>${jamMulai} – ${jamSelesai} WIB</b></div>
          </div>

          <div style="text-align:left;">
            <input type="text" id="dlgUserId" class="dialog-input" placeholder="Masukkan User ID / NIS" onkeyup="if(event.key==='Enter') prosesLoginDariDialog()">
            <input type="password" id="dlgPassword" class="dialog-input" placeholder="Masukkan Password" onkeyup="if(event.key==='Enter') prosesLoginDariDialog()">
            <input type="text" id="dlgToken" class="dialog-input" placeholder="TOKEN UJIAN DARI PENGAWAS" style="text-transform:uppercase; font-weight:700; letter-spacing:1px;" onkeyup="if(event.key==='Enter') prosesLoginDariDialog()">
          </div>

          <div id="dlg-pesan-error" style="display:none; background:#fee2e2; color:#b91c1c; padding:9px 12px; border-radius:8px; font-size:12.5px; font-weight:600; margin-bottom:10px; text-align:left;"></div>

          <button type="button" id="btn-proses-login" class="btn btn-primary" style="width:100%; padding:13px;" onclick="prosesLoginDariDialog()">
            Masuk & Mulai Ujian (Fullscreen)
          </button>
        `,
        didOpen: () => {
          const inp = document.getElementById("dlgUserId");
          if (inp) inp.focus();
        }
      });
    }

    async function prosesLoginDariDialog() {
      if (!mapelTerpilih) return bukaDialogDaftarUjianHariIni();

      const userId = document.getElementById("dlgUserId").value.trim();
      const password = document.getElementById("dlgPassword").value.trim();
      const tokenInput = document.getElementById("dlgToken").value.trim().toUpperCase();
      const boxErr = document.getElementById("dlg-pesan-error");
      const btnLogin = document.getElementById("btn-proses-login");

      if (!userId || !password || !tokenInput) {
        boxErr.innerText = "⚠️ User ID, Password, dan Token Ujian wajib diisi!";
        boxErr.style.display = "block";
        return;
      }

      boxErr.style.display = "none";
      btnLogin.disabled = true;
      btnLogin.innerText = "⏳ Memverifikasi Akun & Token...";

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            aksi: "LOGIN_SISWA",
            userId,
            password,
            kodeMapel: mapelTerpilih.kode,
            tokenInput
          })
        });
        const json = await res.json();

        if (json.status !== "success") {
          btnLogin.disabled = false;
          btnLogin.innerText = "Masuk & Mulai Ujian (Fullscreen)";
          boxErr.innerText = "❌ " + (json.pesan || "Login gagal.");
          boxErr.style.display = "block";
          return;
        }

        // Login Berhasil -> Tutup Dialog & Masuk Mode Ujian Fullscreen
        Swal.close();
        pesertaAktif = json.peserta;
        daftarSoalUjian = json.soal || [];
        jawabanSiswa = json.draftJawaban || {};
        jumlahPelanggaran = Number(json.pelanggaran) || 0;
        waktuSelesaiTimestamp = Number(json.mapel.selesai);
        indeksSoalAktif = 0;

        mulaiSesiUjian(json.mapel.nama);

      } catch (err) {
        btnLogin.disabled = false;
        btnLogin.innerText = "Masuk & Mulai Ujian (Fullscreen)";
        boxErr.innerText = "❌ Gagal terhubung ke server ujian.";
        boxErr.style.display = "block";
      }
    }

    // =====================================================================
    // TAHAP 3: HALAMAN & LOGIKA MENGERJAKAN UJIAN
    // =====================================================================
    function mulaiSesiUjian(namaMapel) {
      sedangUjian = true;
      kunciAntiCurangAktif = false;

      // Aktifkan Fullscreen Browser
      const elem = document.documentElement;
      if (elem.requestFullscreen) {
        elem.requestFullscreen().catch(() => {});
      } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      }

      document.getElementById("ujian-nama-mapel").innerText = namaMapel;
      document.getElementById("ujian-info-peserta").innerText = `Peserta: ${pesertaAktif.nama} (${pesertaAktif.userId}) — Kelas: ${pesertaAktif.kelas}`;
      document.getElementById("badge-pelanggaran").innerText = `Pelanggaran: ${jumlahPelanggaran}/2`;
      document.getElementById("halaman-ujian").style.display = "block";

      renderNavigasiNomor();
      tampilkanSoal(0);
      jalankanTimerUjian();

      // Beri jeda 2.5 detik sebelum sensor anti-curang aktif agar transisi fullscreen stabil
      setTimeout(() => {
        kunciAntiCurangAktif = true;
      }, 2500);
    }

    function jalankanTimerUjian() {
      if (intervalTimer) clearInterval(intervalTimer);
      const elTimer = document.getElementById("timer-ujian");

      intervalTimer = setInterval(() => {
        const sisaMs = waktuSelesaiTimestamp - Date.now();
        if (sisaMs <= 0) {
          clearInterval(intervalTimer);
          elTimer.innerText = "00:00:00";
          kirimJawabanKeServer(true);
          return;
        }
        const totalDetik = Math.floor(sisaMs / 1000);
        const jam = String(Math.floor(totalDetik / 3600)).padStart(2, '0');
        const menit = String(Math.floor((totalDetik % 3600) / 60)).padStart(2, '0');
        const detik = String(totalDetik % 60).padStart(2, '0');
        elTimer.innerText = `${jam}:${menit}:${detik}`;

        if (totalDetik <= 300) elTimer.classList.add("kritis");
      }, 1000);
    }

    function formatMediaSoal(teksRaw) {
      if (!teksRaw) return "";
      let hasil = String(teksRaw);
      const ekstrakUrl = (url, jenis) => {
        const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
        if (m && m[1]) {
          return jenis === 'IMG'
            ? `https://lh3.googleusercontent.com/d/${m[1]}`
            : `https://drive.google.com/uc?export=download&id=${m[1]}`;
        }
        return url;
      };
      hasil = hasil.replace(/\[IMG:(.*?)\]/gi, (_, u) => `<img src="${ekstrakUrl(u.trim(), 'IMG')}" class="media-img">`);
      hasil = hasil.replace(/\[AUDIO:(.*?)\]/gi, (_, u) => `<audio controls class="media-audio" src="${ekstrakUrl(u.trim(), 'AUDIO')}"></audio>`);
      hasil = hasil.replace(/\[VIDEO:(.*?)\]/gi, (_, u) => `<video controls playsinline class="media-video" src="${ekstrakUrl(u.trim(), 'VIDEO')}"></video>`);
      return hasil.replace(/\n/g, '<br>');
    }

    function renderNavigasiNomor() {
      const nav = document.getElementById("nav-nomor-soal");
      nav.innerHTML = daftarSoalUjian.map((s, idx) => {
        const no = String(s.no);
        const sudahDijawab = jawabanSiswa[no] !== undefined && String(jawabanSiswa[no]).trim() !== "";
        const clsAktif = idx === indeksSoalAktif ? "aktif" : "";
        const clsJawab = sudahDijawab ? "terjawab" : "";
        return `<button type="button" class="btn-nomor ${clsAktif} ${clsJawab}" onclick="gantiNomorSoal(${idx})">${no}</button>`;
      }).join('');
    }

    function gantiNomorSoal(idxBaru) {
      if (idxBaru < 0 || idxBaru >= daftarSoalUjian.length) return;
      indeksSoalAktif = idxBaru;
      renderNavigasiNomor();
      tampilkanSoal(idxBaru);
    }

    function tampilkanSoal(idx) {
      const s = daftarSoalUjian[idx];
      if (!s) return;
      const no = String(s.no);
      const tipe = String(s.tipe || 'PG').toUpperCase();
      const jwbTersimpan = String(jawabanSiswa[no] || '');
      let htmlOpsi = "";

      if (tipe === 'PG') {
        const list = [
          { h: 'A', t: s.a }, { h: 'B', t: s.b }, { h: 'C', t: s.c }, { h: 'D', t: s.d }, { h: 'E', t: s.e }
        ].filter(o => o.t !== undefined && String(o.t).trim() !== "");

        htmlOpsi = list.map(o => `
          <label class="opsi-label">
            <input type="radio" name="soal_${no}" value="${o.h}" ${jwbTersimpan === o.h ? 'checked' : ''} onchange="simpanJawabanPG('${no}', '${o.h}')">
            <div><b>${o.h}.</b> ${formatMediaSoal(o.t)}</div>
          </label>`).join('');
      }
      else if (tipe === 'PGK') {
        const terpilihArr = jwbTersimpan ? jwbTersimpan.split(',').map(x => x.trim()) : [];
        const list = [
          { h: 'A', t: s.a }, { h: 'B', t: s.b }, { h: 'C', t: s.c }, { h: 'D', t: s.d }, { h: 'E', t: s.e }
        ].filter(o => o.t !== undefined && String(o.t).trim() !== "");

        htmlOpsi = `<div style="font-size:12px; color:#b45309; font-weight:700; margin-bottom:6px;">* Pilih lebih dari satu jawaban yang benar</div>` +
          list.map(o => `
            <label class="opsi-label">
              <input type="checkbox" value="${o.h}" ${terpilihArr.includes(o.h) ? 'checked' : ''} onchange="simpanJawabanPGK('${no}')">
              <div><b>${o.h}.</b> ${formatMediaSoal(o.t)}</div>
            </label>`).join('');
      }
      else if (tipe === 'BS') {
        const pernyataan = [s.a, s.b, s.c, s.d, s.e].filter(x => x !== undefined && String(x).trim() !== "");
        const arrBS = jwbTersimpan ? jwbTersimpan.split(',') : [];

        htmlOpsi = `
          <table style="width:100%; border-collapse:collapse; margin-top:10px; font-size:14px;">
            <thead>
              <tr style="background:#f1f5f9;">
                <th style="padding:10px; border:1px solid #cbd5e1; text-align:left;">Pernyataan</th>
                <th style="padding:10px; border:1px solid #cbd5e1; text-align:center; width:80px;">Benar</th>
                <th style="padding:10px; border:1px solid #cbd5e1; text-align:center; width:80px;">Salah</th>
              </tr>
            </thead>
            <tbody>
              ${pernyataan.map((teksP, i) => `
                <tr>
                  <td style="padding:10px; border:1px solid #cbd5e1;">${formatMediaSoal(teksP)}</td>
                  <td style="padding:10px; border:1px solid #cbd5e1; text-align:center;">
                    <input type="radio" name="bs_${no}_${i}" value="B" ${arrBS[i] === 'B' ? 'checked' : ''} onchange="simpanJawabanBS('${no}', ${pernyataan.length})">
                  </td>
                  <td style="padding:10px; border:1px solid #cbd5e1; text-align:center;">
                    <input type="radio" name="bs_${no}_${i}" value="S" ${arrBS[i] === 'S' ? 'checked' : ''} onchange="simpanJawabanBS('${no}', ${pernyataan.length})">
                  </td>
                </tr>`).join('')}
            </tbody>
          </table>`;
      }
      else if (tipe === 'URAIAN') {
        htmlOpsi = `
          <textarea class="jawab-uraian" rows="5" placeholder="Ketik jawaban uraian Anda di sini..." oninput="simpanJawabanUraian('${no}', this.value)">${jwbTersimpan}</textarea>`;
      }

      document.getElementById("wadah-soal-aktif").innerHTML = `
        <div style="font-size:13px; font-weight:800; color:#1e40af; margin-bottom:10px;">
          SOAL NOMOR ${no} DARI ${daftarSoalUjian.length} (${tipe})
        </div>
        <div style="font-size:15.5px; line-height:1.6; margin-bottom:14px;">
          ${formatMediaSoal(s.tanya)}
        </div>
        ${htmlOpsi}
      `;

      document.getElementById("btn-prev-soal").disabled = (idx === 0);
      document.getElementById("btn-next-soal").style.display = (idx === daftarSoalUjian.length - 1) ? "none" : "inline-flex";
    }

    function simpanJawabanPG(no, val) {
      jawabanSiswa[no] = val;
      renderNavigasiNomor();
    }

    function simpanJawabanPGK(no) {
      const checked = Array.from(document.querySelectorAll('#wadah-soal-aktif input[type="checkbox"]:checked')).map(c => c.value);
      jawabanSiswa[no] = checked.join(',');
      renderNavigasiNomor();
    }

    function simpanJawabanBS(no, jmlBaris) {
      const hasil = [];
      for (let i = 0; i < jmlBaris; i++) {
        const r = document.querySelector(`input[name="bs_${no}_${i}"]:checked`);
        hasil.push(r ? r.value : '');
      }
      jawabanSiswa[no] = hasil.join(',');
      renderNavigasiNomor();
    }

    function simpanJawabanUraian(no, val) {
      jawabanSiswa[no] = val;
      renderNavigasiNomor();
    }

    async function konfirmasiSelesaiUjian() {
      const belumDijawab = daftarSoalUjian.filter(s => !jawabanSiswa[String(s.no)] || String(jawabanSiswa[String(s.no)]).trim() === "").length;
      const konfirm = await Swal.fire({
        title: 'Kumpulkan Jawaban Ujian?',
        html: belumDijawab > 0
          ? `Masih ada <b>${belumDijawab} soal</b> yang belum dijawab.<br>Yakin ingin mengakhiri ujian sekarang?`
          : 'Semua soal telah dijawab. Yakin ingin mengakhiri ujian dan mengirim jawaban?',
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'Ya, Kirim Jawaban',
        cancelButtonText: 'Periksa Lagi'
      });
      if (konfirm.isConfirmed) {
        kirimJawabanKeServer(false);
      }
    }

    async function kirimJawabanKeServer(otomatisWaktuHabis) {
      sedangUjian = false;
      kunciAntiCurangAktif = false;
      if (intervalTimer) clearInterval(intervalTimer);

      Swal.fire({
        title: otomatisWaktuHabis ? 'Waktu Habis! Mengirim Jawaban...' : 'Mengirim Jawaban Ujian...',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            aksi: "SUBMIT",
            userId: pesertaAktif.userId,
            kodeMapel: mapelTerpilih.kode,
            jawaban: jawabanSiswa
          })
        });
        const json = await res.json();

        if (document.fullscreenElement) {
          document.exitFullscreen().catch(() => {});
        }
        document.getElementById("halaman-ujian").style.display = "none";

        await Swal.fire({
          icon: 'success',
          title: 'Ujian Selesai!',
          html: `Terima kasih <b>${pesertaAktif.nama}</b>, jawaban Anda telah tersimpan.<br><br>
                 <div style="font-size:18px; font-weight:800; color:#16a34a;">Skor Objektif: ${json.skor}</div>`,
          confirmButtonText: 'Kembali ke Daftar Ujian'
        });

        bukaDialogDaftarUjianHariIni();
      } catch (err) {
        Swal.fire('Gagal Mengirim', 'Koneksi terputus saat mengirim jawaban. Klik tombol Selesai sekali lagi.', 'error');
        sedangUjian = true;
      }
    }

    // --- DETEKSI PINDAH TAB / KELUAR FULLSCREEN ---
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && sedangUjian && kunciAntiCurangAktif) {
        catatPelanggaranSiswa("Meninggalkan layar ujian / berpindah tab");
      }
    });

    async function catatPelanggaranSiswa(keterangan) {
      kunciAntiCurangAktif = false;
      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            aksi: "PELANGGARAN",
            userId: pesertaAktif.userId,
            kodeMapel: mapelTerpilih.kode,
            keterangan,
            jawaban: jawabanSiswa
          })
        });
        const json = await res.json();
        jumlahPelanggaran = json.pelanggaranKe || (jumlahPelanggaran + 1);
        document.getElementById("badge-pelanggaran").innerText = `Pelanggaran: ${jumlahPelanggaran}/2`;

        if (jumlahPelanggaran >= 2) {
          sedangUjian = false;
          if (intervalTimer) clearInterval(intervalTimer);
          if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
          document.getElementById("halaman-ujian").style.display = "none";

          await Swal.fire({
            icon: 'error',
            title: 'AKUN TERKUNCI!',
            text: 'Anda melakukan pelanggaran ke-2. Hubungi proktor untuk membuka kunci akun Anda.',
            allowOutsideClick: false
          });
          bukaDialogDaftarUjianHariIni();
        } else {
          await Swal.fire({
            icon: 'warning',
            title: 'Peringatan Pelanggaran (1/2)',
            text: 'Dilarang meninggalkan halaman ujian! Pelanggaran berikutnya akan mengunci akun Anda.',
            confirmButtonText: 'Saya Mengerti & Lanjutkan'
          });
          if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
          }
          setTimeout(() => { kunciAntiCurangAktif = true; }, 1500);
        }
      } catch (e) {
        setTimeout(() => { kunciAntiCurangAktif = true; }, 1500);
      }
    }
  </script>
</body>
</html>
