<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Ujian Online - SMK Negeri 1 Purwoasri</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    * { box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      overflow-x: hidden;
      background-color: #0f172a;
    }

    .bg-animated {
      position: fixed;
      inset: -5%;
      width: 110%;
      height: 110%;
      background-image: url('https://lh3.googleusercontent.com/d/1Vo2a5qqGEPQm3XzyB0-qZr9NdBvNtXGX');
      background-size: cover;
      background-position: center;
      z-index: -2;
      animation: kenBurnsDinamis 25s ease-in-out infinite alternate;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.75), rgba(30, 58, 138, 0.58));
      backdrop-filter: blur(3px);
      z-index: -1;
    }

    @keyframes kenBurnsDinamis {
      0% { transform: scale(1) translate(0px, 0px); }
      50% { transform: scale(1.08) translate(-15px, -10px); }
      100% { transform: scale(1.12) translate(15px, 10px); }
    }

    @keyframes munculHalus {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .box {
      width: 100%;
      max-width: 780px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      animation: munculHalus 0.7s ease-out;
    }

    #halaman-login { max-width: 480px; }

    .kop-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding-bottom: 16px;
      margin-bottom: 20px;
      border-bottom: 3px double #1e293b;
      text-align: left;
    }

    .kop-logo { width: 68px; height: auto; object-fit: contain; flex-shrink: 0; }
    .kop-teks { line-height: 1.3; color: #0f172a; }
    .kop-teks .baris-1 { font-size: 13px; font-weight: 600; letter-spacing: 0.5px; }
    .kop-teks .baris-2 { font-size: 14px; font-weight: 700; letter-spacing: 0.5px; }
    .kop-teks .baris-3 { font-size: 17px; font-weight: 800; color: #1e3a8a; margin-top: 2px; }

    input[type="text"], input[type="password"] {
      padding: 13px 15px;
      margin: 8px 0;
      width: 100%;
      border-radius: 8px;
      border: 1.5px solid #cbd5e1;
      font-size: 15px;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    button {
      padding: 13px;
      margin-top: 14px;
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35); }
    .btn-selesai { background: linear-gradient(135deg, #16a34a, #15803d); }
    .btn-selesai:hover { box-shadow: 0 8px 18px rgba(22, 163, 74, 0.35); }

    .badge-tipe {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 20px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .badge-pg { background: #e0f2fe; color: #0369a1; }
    .badge-pgk { background: #fef3c7; color: #b45309; }
    .badge-bs { background: #f3e8ff; color: #7e22ce; }

    .opsi-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 14px;
      margin: 6px 0;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .opsi-label:hover { background: #eff6ff; border-color: #93c5fd; }
    .opsi-label input { margin-top: 3px; width: auto; cursor: pointer; }

    .tabel-bs {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 14px;
    }
    .tabel-bs th, .tabel-bs td { border: 1px solid #cbd5e1; padding: 10px; }
    .tabel-bs th { background: #f1f5f9; color: #1e293b; text-align: center; }
    .tabel-bs td.tengah { text-align: center; width: 85px; }

    #halaman-ujian { display: none; }
  </style>
</head>
<body oncontextmenu="return false;">

  <div class="bg-animated"></div>
  <div class="bg-overlay"></div>

  <!-- 1. FORM LOGIN -->
  <div id="halaman-login" class="box">
    <div class="kop-header">
      <img src="https://lh3.googleusercontent.com/d/1KZZymSyz_c9hLLoV2Rcx5_VrabMre6Db" alt="Logo SMK Negeri 1 Purwoasri" class="kop-logo">
      <div class="kop-teks">
        <div class="baris-1">PEMERINTAH PROVINSI JAWA TIMUR</div>
        <div class="baris-2">DINAS PENDIDIKAN</div>
        <div class="baris-3">SMK NEGERI 1 PURWOASRI</div>
      </div>
    </div>

    <div style="text-align: center; margin-bottom: 15px;">
      <h3 style="margin: 0 0 4px 0; color: #1e293b;">Portal Ujian Online</h3>
      <span style="color: #64748b; font-size: 13px;">Silakan masuk menggunakan akun peserta Anda</span>
    </div>

    <input type="text" id="userId" placeholder="Masukkan User ID">
    <input type="password" id="password" placeholder="Masukkan Password">
    <button onclick="mulaiLogin()">Masuk & Mulai Ujian (Fullscreen)</button>
  </div>

  <!-- 2. HALAMAN UJIAN -->
  <div id="halaman-ujian" class="box" style="margin: 30px auto;">
    <div class="kop-header">
      <img src="https://lh3.googleusercontent.com/d/1KZZymSyz_c9hLLoV2Rcx5_VrabMre6Db" alt="Logo SMK Negeri 1 Purwoasri" class="kop-logo">
      <div class="kop-teks">
        <div class="baris-1">PEMERINTAH PROVINSI JAWA TIMUR</div>
        <div class="baris-2">DINAS PENDIDIKAN</div>
        <div class="baris-3">SMK NEGERI 1 PURWOASRI</div>
      </div>
    </div>

    <div id="info-peserta" style="background: #eff6ff; border-left: 4px solid #2563eb; padding: 10px 14px; border-radius: 6px; margin-bottom: 20px; font-weight: bold; color: #1e3a8a;"></div>
    <div id="wadah-soal"></div>
    <button class="btn-selesai" onclick="konfirmasiKirim()">Selesai & Kirim Jawaban</button>
  </div>

  <script>
    // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwMuxMhxJ8DVJoHpAiZb0t8zaViGe6k7smeqgO99toHj7S6Me17LW2djpd5qI1rBnh-Sw/exec";
    
    let userAktif = "";
    let daftarSoalGlobal = [];
    let jumlahPelanggaranSaatIni = 0;
    let ujianBerjalan = false;
    let sedangProsesLogout = false;

    async function panggilGAS(payload) {
      const res = await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      return res.json();
    }

    async function mulaiLogin() {
      const userId = document.getElementById("userId").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!userId || !password) {
        Swal.fire({ icon: 'warning', title: 'Data Belum Lengkap', text: 'Silakan isi User ID dan Password terlebih dahulu!' });
        return;
      }

      Swal.fire({ title: 'Memverifikasi Akun...', text: 'Mohon tunggu sebentar', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

      try {
        const hasil = await panggilGAS({ aksi: "LOGIN", userId, password });
        if (hasil.status !== "success") {
          Swal.fire({ icon: 'error', title: 'Login Gagal', text: hasil.pesan });
          return;
        }

        Swal.close();

        if (document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen().catch(() => {});
        }

        userAktif = userId;
        daftarSoalGlobal = hasil.soal;
        jumlahPelanggaranSaatIni = hasil.pelanggaran || 0;
        ujianBerjalan = true;
        sedangProsesLogout = false;

        document.body.style.alignItems = "flex-start";
        document.getElementById("halaman-login").style.display = "none";
        document.getElementById("halaman-ujian").style.display = "block";
        
        const infoPeringatan = jumlahPelanggaranSaatIni > 0 
          ? ` | <span style="color:#dc2626;">Catatan Pelanggaran: ${jumlahPelanggaranSaatIni}x</span>` 
          : '';
        document.getElementById("info-peserta").innerHTML = `Peserta: ${hasil.nama} (ID: ${userId})${infoPeringatan}`;

        renderSemuaSoal(hasil.soal);
        pulihkanJawaban(hasil.draftJawaban);

        // Beri info jika jawaban sebelumnya berhasil dipulihkan
        if (hasil.draftJawaban && Object.keys(hasil.draftJawaban).length > 0) {
          Swal.fire({
            icon: 'info',
            title: 'Jawaban Sebelumnya Dipulihkan',
            text: 'Jawaban Anda sebelum logout pelanggaran pertama telah dimuat kembali. Jangan tinggalkan halaman ujian lagi karena jawaban akan dihapus permanen!',
            confirmButtonText: 'Lanjutkan Ujian'
          });
        }

      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Kesalahan Koneksi', text: 'Gagal terhubung ke server ujian. Periksa koneksi internet Anda.' });
      }
    }

    function renderSemuaSoal(soalList) {
      const wadah = document.getElementById("wadah-soal");
      const hurufOpsi = ['a', 'b', 'c', 'd', 'e'];

      wadah.innerHTML = soalList.map(s => {
        const tipe = s.tipe || 'PG';
        let kontenOpsi = '';
        let badgeHTML = '';

        if (tipe === 'PG') {
          badgeHTML = `<span class="badge-tipe badge-pg">Pilihan Ganda (Pilih 1 Jawaban)</span>`;
          kontenOpsi = hurufOpsi.map(h => {
            if (!s[h]) return '';
            const H = h.toUpperCase();
            return `
              <label class="opsi-label">
                <input type="radio" name="soal_${s.no}" value="${H}">
                <span><b>${H}.</b> ${s[h]}</span>
              </label>`;
          }).join('');
        } 
        else if (tipe === 'PGK') {
          badgeHTML = `<span class="badge-tipe badge-pgk">Pilihan Ganda Kompleks (Bisa Pilih Lebih Dari 1)</span>`;
          kontenOpsi = hurufOpsi.map(h => {
            if (!s[h]) return '';
            const H = h.toUpperCase();
            return `
              <label class="opsi-label">
                <input type="checkbox" name="soal_${s.no}" value="${H}">
                <span><b>${H}.</b> ${s[h]}</span>
              </label>`;
          }).join('');
        } 
        else if (tipe === 'BS') {
          badgeHTML = `<span class="badge-tipe badge-bs">Pilihan Ganda Kompleks (Benar / Salah)</span>`;
          const barisPernyataan = hurufOpsi.map((h, idx) => {
            if (!s[h]) return '';
            return `
              <tr>
                <td>${s[h]}</td>
                <td class="tengah"><input type="radio" name="soal_${s.no}_item_${idx}" value="B" style="cursor:pointer;"></td>
                <td class="tengah"><input type="radio" name="soal_${s.no}_item_${idx}" value="S" style="cursor:pointer;"></td>
              </tr>`;
          }).join('');

          kontenOpsi = `
            <table class="tabel-bs">
              <thead>
                <tr>
                  <th style="text-align:left;">Pernyataan</th>
                  <th>Benar</th>
                  <th>Salah</th>
                </tr>
              </thead>
              <tbody>${barisPernyataan}</tbody>
            </table>`;
        }

        return `
          <div style="margin-bottom:26px; padding-bottom:20px; border-bottom:1px solid #e2e8f0;">
            ${badgeHTML}
            <p style="font-size:16px; color:#0f172a; margin-top:4px;"><b>${s.no}. ${s.tanya}</b></p>
            ${kontenOpsi}
          </div>`;
      }).join('');
    }

    function pulihkanJawaban(draft) {
      if (!draft) return;
      daftarSoalGlobal.forEach(s => {
        const nilai = draft[s.no];
        if (!nilai) return;
        const tipe = s.tipe || 'PG';

        if (tipe === 'PG') {
          const el = document.querySelector(`input[name="soal_${s.no}"][value="${nilai}"]`);
          if (el) el.checked = true;
        } 
        else if (tipe === 'PGK') {
          nilai.split(',').forEach(huruf => {
            const el = document.querySelector(`input[name="soal_${s.no}"][value="${huruf}"]`);
            if (el) el.checked = true;
          });
        } 
        else if (tipe === 'BS') {
          nilai.split(',').forEach((bs, idx) => {
            if (bs === 'B' || bs === 'S') {
              const el = document.querySelector(`input[name="soal_${s.no}_item_${idx}"][value="${bs}"]`);
              if (el) el.checked = true;
            }
          });
        }
      });
    }

    function kumpulkanJawaban() {
      const jawaban = {};
      const hurufOpsi = ['a', 'b', 'c', 'd', 'e'];

      daftarSoalGlobal.forEach(s => {
        const tipe = s.tipe || 'PG';

        if (tipe === 'PG') {
          const terpilih = document.querySelector(`input[name="soal_${s.no}"]:checked`);
          jawaban[s.no] = terpilih ? terpilih.value : "";
        } 
        else if (tipe === 'PGK') {
          const terpilih = Array.from(document.querySelectorAll(`input[name="soal_${s.no}"]:checked`)).map(el => el.value);
          jawaban[s.no] = terpilih.join(',');
        } 
        else if (tipe === 'BS') {
          const hasilBS = [];
          hurufOpsi.forEach((h, idx) => {
            if (s[h]) {
              const terpilih = document.querySelector(`input[name="soal_${s.no}_item_${idx}"]:checked`);
              hasilBS.push(terpilih ? terpilih.value : "-");
            }
          });
          jawaban[s.no] = hasilBS.join(',');
        }
      });

      return jawaban;
    }

    function kembaliKeHalamanLogin() {
      ujianBerjalan = false;
      userAktif = "";
      daftarSoalGlobal = [];
      document.getElementById("wadah-soal").innerHTML = "";
      document.getElementById("password").value = "";
      document.getElementById("halaman-ujian").style.display = "none";
      document.getElementById("halaman-login").style.display = "block";
      document.body.style.alignItems = "center";

      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
    }

    async function tanganiPelanggaran(alasan) {
      if (!ujianBerjalan || sedangProsesLogout) return;
      sedangProsesLogout = true;
      ujianBerjalan = false;

      const pelanggaranKe = jumlahPelanggaranSaatIni + 1;
      const jawabanSekarang = pelanggaranKe === 1 ? kumpulkanJawaban() : {};

      // Langsung kembalikan tampilan ke halaman Login
      const idPelanggar = userAktif;
      kembaliKeHalamanLogin();

      if (pelanggaranKe === 1) {
        Swal.fire({
          icon: 'warning',
          title: 'PERINGATAN PELANGGARAN KE-1!',
          html: `Anda terdeteksi: <b>${alasan}</b>.<br><br>Sesi Anda telah dikeluarkan otomatis, namun <b>jawaban Anda MASIH TERSIMPAN</b>.<br>Silakan login kembali. <b>Jika melanggar ke-2 kalinya, seluruh jawaban Anda akan DIHAPUS!</b>`,
          confirmButtonText: 'Mengerti',
          confirmButtonColor: '#d97706',
          allowOutsideClick: false
        });
      } else {
        Swal.fire({
          icon: 'error',
          title: 'PELANGGARAN KE-' + pelanggaranKe + '!',
          html: `Anda kembali terdeteksi: <b>${alasan}</b>.<br><br>Sesi Anda dikeluarkan otomatis dan <b>SELURUH JAWABAN ANDA TELAH DIHAPUS!</b>`,
          confirmButtonText: 'Tutup',
          confirmButtonColor: '#dc2626',
          allowOutsideClick: false
        });
      }

      // Kirim laporan pelanggaran ke Google Apps Script
      await panggilGAS({
        aksi: "PELANGGARAN",
        userId: idPelanggar,
        keterangan: alasan,
        jawaban: jawabanSekarang
      }).catch(() => {});

      sedangProsesLogout = false;
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) tanganiPelanggaran("Berpindah tab atau me-minimize browser");
    });

    window.addEventListener("blur", () => {
      tanganiPelanggaran("Jendela browser kehilangan fokus");
    });

    document.addEventListener("fullscreenchange", () => {
      if (!document.fullscreenElement && ujianBerjalan) {
        tanganiPelanggaran("Keluar dari mode Fullscreen");
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "F12" || (e.ctrlKey && e.shiftKey && e.key === "I") || (e.ctrlKey && e.key === "u")) {
        e.preventDefault();
        tanganiPelanggaran("Mencoba membuka Inspect Element / Source Code");
      }
    });

    function konfirmasiKirim() {
      Swal.fire({
        title: 'Kirim Jawaban Sekarang?',
        text: 'Pastikan semua soal sudah terisi. Anda tidak dapat mengubah jawaban setelah dikirim.',
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#16a34a',
        cancelButtonColor: '#64748b',
        confirmButtonText: 'Ya, Kirim Jawaban!',
        cancelButtonText: 'Batal'
      }).then((result) => {
        if (result.isConfirmed) prosesKirimJawaban();
      });
    }

    async function prosesKirimJawaban() {
      ujianBerjalan = false;
      Swal.fire({ title: 'Menyimpan & Mengoreksi Jawaban...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

      const jawaban = kumpulkanJawaban();
      const hasil = await panggilGAS({ aksi: "SUBMIT", userId: userAktif, jawaban });
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});

      Swal.fire({
        icon: 'success',
        title: 'Ujian Selesai!',
        html: `Jawaban Anda berhasil direkam.<br>Skor Akhir Anda: <b style="font-size:26px; color:#16a34a;">${hasil.skor}</b>`,
        confirmButtonText: 'Tutup'
      });

      document.getElementById("halaman-ujian").innerHTML = `
        <div style="text-align:center; padding: 30px;">
          <h2>Ujian Telah Selesai</h2>
          <p style="color:#475569;">Terima kasih telah mengikuti ujian dengan jujur.</p>
          <p style="font-size: 22px; margin-top: 20px;">Skor Akhir Anda: <b style="color:#16a34a;">${hasil.skor}</b></p>
        </div>
      `;
    }
  </script>
</body>
</html>
