<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ujian Online - SMK Negeri 1 Purwoasri</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    * { box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
      background-color: #0f172a;
    }

    .bg-animated {
      position: fixed;
      inset: -5%;
      width: 110%;
      height: 110%;
      background-image: url('https://lh3.googleusercontent.com/d/1Vo2a5qqGEPQm3XzyB0-qZr9NdBvNtXGX');
      background-size: cover;
      background-position: center;
      z-index: -2;
      animation: kenBurnsDinamis 25s ease-in-out infinite alternate;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.76), rgba(30, 58, 138, 0.58));
      backdrop-filter: blur(3px);
      z-index: -1;
    }

    @keyframes kenBurnsDinamis {
      0% { transform: scale(1) translate(0px, 0px); }
      50% { transform: scale(1.08) translate(-15px, -10px); }
      100% { transform: scale(1.12) translate(15px, 10px); }
    }

    @keyframes munculHalus {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .box {
      width: 100%;
      max-width: 820px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 26px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      animation: munculHalus 0.6s ease-out;
    }

    #halaman-login { max-width: 480px; }

    .kop-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding-bottom: 14px;
      margin-bottom: 18px;
      border-bottom: 3px double #1e293b;
      text-align: left;
    }

    .kop-logo { width: 62px; height: auto; object-fit: contain; flex-shrink: 0; }
    .kop-teks { line-height: 1.3; color: #0f172a; }
    .kop-teks .baris-1 { font-size: 12px; font-weight: 600; letter-spacing: 0.4px; }
    .kop-teks .baris-2 { font-size: 13px; font-weight: 700; letter-spacing: 0.4px; }
    .kop-teks .baris-3 { font-size: 16px; font-weight: 800; color: #1e3a8a; margin-top: 2px; }

    input[type="text"], input[type="password"] {
      padding: 13px 15px;
      margin: 8px 0;
      width: 100%;
      border-radius: 8px;
      border: 1.5px solid #cbd5e1;
      font-size: 15px;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    .btn-utama {
      padding: 13px;
      margin-top: 14px;
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-utama:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(37, 99, 235, 0.35); }

    .baris-atas-ujian {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      background: #eff6ff;
      border-left: 4px solid #2563eb;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .info-teks { font-weight: bold; color: #1e3a8a; font-size: 14px; }

    .btn-toggle-nav {
      background: #1e3a8a;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-toggle-nav:hover { background: #1d4ed8; }

    #panel-navigasi {
      display: none;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 18px;
      animation: munculHalus 0.25s ease-out;
    }

    .legenda-nav {
      display: flex;
      gap: 14px;
      font-size: 12px;
      color: #475569;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .legenda-item { display: flex; align-items: center; gap: 5px; }
    .kotak-legenda { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }

    .grid-nomor {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
      gap: 8px;
    }

    .btn-nomor {
      padding: 9px 0;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: white;
      color: #334155;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-nomor:hover { border-color: #2563eb; }
    .btn-nomor.terjawab { background: #16a34a; color: white; border-color: #15803d; }
    .btn-nomor.aktif { background: #2563eb; color: white; border-color: #1d4ed8; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25); }

    .kartu-soal-tunggal { min-height: 260px; padding: 10px 4px; }

    .header-nomor-soal {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .nomor-besar {
      font-size: 15px;
      font-weight: 800;
      color: #1e293b;
      background: #e2e8f0;
      padding: 4px 12px;
      border-radius: 6px;
    }

    .badge-tipe {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .badge-pg { background: #e0f2fe; color: #0369a1; }
    .badge-pgk { background: #fef3c7; color: #b45309; }
    .badge-bs { background: #f3e8ff; color: #7e22ce; }

    .media-wrapper { display: block; margin: 10px 0; }
    .media-img {
      max-width: 100%;
      max-height: 320px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      display: block;
      margin-top: 6px;
    }
    .opsi-label .media-img { max-height: 160px; }
    .media-audio { width: 100%; max-width: 420px; height: 40px; margin-top: 6px; display: block; }
    .media-video { width: 100%; max-width: 540px; max-height: 320px; border-radius: 8px; background: #000; margin-top: 6px; display: block; }

    .opsi-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      margin: 8px 0;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .opsi-label:hover { background: #eff6ff; border-color: #93c5fd; }
    .opsi-label input { margin-top: 4px; width: auto; cursor: pointer; transform: scale(1.15); flex-shrink: 0; }
    .opsi-konten { flex: 1; line-height: 1.45; }

    .tabel-bs { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    .tabel-bs th, .tabel-bs td { border: 1px solid #cbd5e1; padding: 10px; }
    .tabel-bs th { background: #f1f5f9; color: #1e293b; text-align: center; }
    .tabel-bs td.tengah { text-align: center; width: 75px; }
    .tabel-bs input[type="radio"] { transform: scale(1.2); cursor: pointer; }

    .navigasi-bawah {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
    }

    .btn-nav {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 135px;
    }

    .btn-prev { background: #64748b; color: white; }
    .btn-prev:hover:not(:disabled) { background: #475569; }
    .btn-prev:disabled { background: #cbd5e1; color: #94a3b8; cursor: not-allowed; }

    .btn-next { background: #2563eb; color: white; }
    .btn-next:hover { background: #1d4ed8; }

    .btn-finish { background: linear-gradient(135deg, #16a34a, #15803d); color: white; }
    .btn-finish:hover { box-shadow: 0 6px 15px rgba(22, 163, 74, 0.35); }

    #halaman-ujian { display: none; }

    @media (max-width: 480px) {
      .box { padding: 18px; }
      .kop-logo { width: 50px; }
      .kop-teks .baris-1 { font-size: 10px; }
      .kop-teks .baris-2 { font-size: 11px; }
      .kop-teks .baris-3 { font-size: 14px; }
      .btn-nav { padding: 11px 12px; min-width: 110px; font-size: 13px; }
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <div class="bg-animated"></div>
  <div class="bg-overlay"></div>

  <!-- 1. FORM LOGIN -->
  <div id="halaman-login" class="box">
    <div class="kop-header">
      <img src="https://lh3.googleusercontent.com/d/1KZZymSyz_c9hLLoV2Rcx5_VrabMre6Db" alt="Logo SMK Negeri 1 Purwoasri" class="kop-logo">
      <div class="kop-teks">
        <div class="baris-1">PEMERINTAH PROVINSI JAWA TIMUR</div>
        <div class="baris-2">DINAS PENDIDIKAN</div>
        <div class="baris-3">SMK NEGERI 1 PURWOASRI</div>
      </div>
    </div>

    <div style="text-align: center; margin-bottom: 15px;">
      <h3 style="margin: 0 0 4px 0; color: #1e293b;">Portal Ujian Online</h3>
      <span style="color: #64748b; font-size: 13px;">Silakan masuk menggunakan akun peserta Anda</span>
    </div>

    <input type="text" id="userId" placeholder="Masukkan User ID">
    <input type="password" id="password" placeholder="Masukkan Password">
    <button class="btn-utama" onclick="mulaiLogin()">Masuk & Mulai Ujian (Fullscreen)</button>
  </div>

  <!-- 2. HALAMAN UJIAN -->
  <div id="halaman-ujian" class="box">
    <div class="kop-header">
      <img src="https://lh3.googleusercontent.com/d/1KZZymSyz_c9hLLoV2Rcx5_VrabMre6Db" alt="Logo SMK Negeri 1 Purwoasri" class="kop-logo">
      <div class="kop-teks">
        <div class="baris-1">PEMERINTAH PROVINSI JAWA TIMUR</div>
        <div class="baris-2">DINAS PENDIDIKAN</div>
        <div class="baris-3">SMK NEGERI 1 PURWOASRI</div>
      </div>
    </div>

    <div class="baris-atas-ujian">
      <div id="info-peserta" class="info-teks"></div>
      <button type="button" class="btn-toggle-nav" onclick="toggleNavigasi()" id="btn-toggle-nav">
        ☰ Daftar Soal
      </button>
    </div>

    <div id="panel-navigasi">
      <div class="legenda-nav">
        <span class="legenda-item"><span class="kotak-legenda" style="background:#2563eb;"></span> Sedang Dibuka</span>
        <span class="legenda-item"><span class="kotak-legenda" style="background:#16a34a;"></span> Sudah Dijawab</span>
        <span class="legenda-item"><span class="kotak-legenda" style="background:#ffffff; border:1px solid #cbd5e1;"></span> Belum Dijawab</span>
      </div>
      <div id="grid-nomor" class="grid-nomor"></div>
    </div>

    <div id="wadah-soal" class="kartu-soal-tunggal"></div>

    <div class="navigasi-bawah">
      <button type="button" class="btn-nav btn-prev" id="btn-sebelumnya" onclick="pindahSoal(-1)">
        ← Sebelumnya
      </button>
      <button type="button" class="btn-nav btn-next" id="btn-berikutnya" onclick="pindahSoal(1)">
        Berikutnya →
      </button>
      <button type="button" class="btn-nav btn-finish" id="btn-selesai" onclick="konfirmasiKirim()" style="display: none;">
        ✔ Selesai & Kirim
      </button>
    </div>
  </div>

  <script>
    // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
    const GAS_URL = "TEMPEL_URL_WEB_APP_GAS_ANDA_DI_SINI";
    
    let userAktif = "";
    let daftarSoalGlobal = [];
    let jawabanTersimpan = {};
    let indexSoalAktif = 0;
    let jumlahPelanggaranSaatIni = 0;
    let ujianBerjalan = false;
    let sedangProsesLogout = false;
    let timerBlur = null;
    let intervalPengawas = null;

    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    function formatKontenMedia(teksRaw) {
      if (!teksRaw) return "";
      let hasil = String(teksRaw);

      const ekstrakDirectUrl = (url, jenis) => {
        const matchDrive = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
        if (matchDrive && matchDrive[1]) {
          const fileId = matchDrive[1];
          if (jenis === 'IMG') {
            return `https://lh3.googleusercontent.com/d/${fileId}`;
          } else {
            return `https://drive.google.com/uc?export=download&id=${fileId}`;
          }
        }
        return url;
      };

      hasil = hasil.replace(/\[IMG:(.*?)\]/gi, (_, url) => {
        const src = ekstrakDirectUrl(url.trim(), 'IMG');
        return `<span class="media-wrapper"><img src="${src}" class="media-img" alt="Gambar Soal" loading="lazy"></span>`;
      });

      hasil = hasil.replace(/\[AUDIO:(.*?)\]/gi, (_, url) => {
        const src = ekstrakDirectUrl(url.trim(), 'AUDIO');
        return `<span class="media-wrapper"><audio controls controlsList="nodownload" class="media-audio" src="${src}">Browser tidak mendukung audio.</audio></span>`;
      });

      hasil = hasil.replace(/\[VIDEO:(.*?)\]/gi, (_, url) => {
        const src = ekstrakDirectUrl(url.trim(), 'VIDEO');
        return `<span class="media-wrapper"><video controls controlsList="nodownload" playsinline class="media-video" src="${src}">Browser tidak mendukung video.</video></span>`;
      });

      return hasil.replace(/\n/g, '<br>');
    }

    async function panggilGAS(payload) {
      const res = await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      return res.json();
    }

    async function masukFullscreenAman() {
      try {
        if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        }
      } catch (e) {}
    }

    function mulaiPengawasanAktif() {
      hentikanPengawasanAktif();
      ujianBerjalan = true;

      // Heartbeat check setiap 400ms: memastikan mode fullscreen & visibilitas selalu terjaga
      intervalPengawas = setInterval(() => {
        if (!ujianBerjalan || sedangProsesLogout) return;

        // Cek 1: Jika tab disembunyikan / pindah aplikasi
        if (document.hidden) {
          tanganiPelanggaran("Berpindah tab atau membuka aplikasi lain");
          return;
        }

        // Cek 2: Jika keluar dari Fullscreen (baik klik tombol X atas, ESC, maupun F11)
        if (!isMobile && !document.fullscreenElement) {
          tanganiPelanggaran("Keluar dari mode Fullscreen");
          return;
        }
      }, 400);
    }

    function hentikanPengawasanAktif() {
      ujianBerjalan = false;
      if (intervalPengawas) {
        clearInterval(intervalPengawas);
        intervalPengawas = null;
      }
      if (timerBlur) {
        clearTimeout(timerBlur);
        timerBlur = null;
      }
    }

    async function mulaiLogin() {
      const userId = document.getElementById("userId").value.trim();
      const password = document.getElementById("password").value.trim();

      if (!userId || !password) {
        Swal.fire({ icon: 'warning', title: 'Data Belum Lengkap', text: 'Silakan isi User ID dan Password terlebih dahulu!' });
        return;
      }

      // Masuk fullscreen langsung saat klik tombol login (masih dalam user gesture)
      await masukFullscreenAman();

      Swal.fire({ title: 'Memverifikasi Akun...', text: 'Mohon tunggu sebentar', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

      try {
        const hasil = await panggilGAS({ aksi: "LOGIN", userId, password });
        if (hasil.status !== "success") {
          Swal.fire({ icon: 'error', title: 'Login Gagal', text: hasil.pesan });
          return;
        }

        Swal.close();

        userAktif = userId;
        daftarSoalGlobal = hasil.soal;
        jawabanTersimpan = hasil.draftJawaban || {};
        indexSoalAktif = 0;
        jumlahPelanggaranSaatIni = hasil.pelanggaran || 0;
        sedangProsesLogout = false;

        document.getElementById("halaman-login").style.display = "none";
        document.getElementById("halaman-ujian").style.display = "block";
        document.getElementById("panel-navigasi").style.display = "none";
        document.getElementById("btn-toggle-nav").innerText = "☰ Daftar Soal";
        
        const infoPeringatan = jumlahPelanggaranSaatIni > 0 
          ? ` | <span style="color:#dc2626;">Pelanggaran: ${jumlahPelanggaranSaatIni}x</span>` 
          : '';
        document.getElementById("info-peserta").innerHTML = `${hasil.nama} (${userId})${infoPeringatan}`;

        tampilkanSoal(0);

        if (hasil.draftJawaban && Object.keys(hasil.draftJawaban).length > 0) {
          // Tampilkan info pemulihan dulu, baru nyalakan sensor pengawas setelah siswa klik "Lanjutkan Ujian"
          await Swal.fire({
            icon: 'info',
            title: 'Jawaban Sebelumnya Dipulihkan',
            text: 'Jawaban Anda sebelum logout pelanggaran pertama telah dimuat kembali. Jangan tinggalkan halaman ujian atau keluar dari Fullscreen lagi karena seluruh jawaban akan DIHAPUS!',
            confirmButtonText: 'Lanjutkan Ujian',
            allowOutsideClick: false
          });
          await masukFullscreenAman();
        } else {
          await masukFullscreenAman();
        }

        // Beri jeda 500ms setelah masuk fullscreen agar stabil, lalu aktifkan sensor pengawas
        setTimeout(() => {
          mulaiPengawasanAktif();
        }, 500);

      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Kesalahan Koneksi', text: 'Gagal terhubung ke server ujian. Periksa koneksi internet Anda.' });
      }
    }

    function toggleNavigasi() {
      simpanJawabanSoalAktif();
      const panel = document.getElementById("panel-navigasi");
      const btn = document.getElementById("btn-toggle-nav");
      if (panel.style.display === "none" || panel.style.display === "") {
        renderGridNavigasi();
        panel.style.display = "block";
        btn.innerText = "✕ Tutup Daftar";
      } else {
        panel.style.display = "none";
        btn.innerText = "☰ Daftar Soal";
      }
    }

    function renderGridNavigasi() {
      const grid = document.getElementById("grid-nomor");
      grid.innerHTML = daftarSoalGlobal.map((s, idx) => {
        const sudahDijawab = cekApakahSudahDijawab(s);
        let kelas = "btn-nomor";
        if (idx === indexSoalAktif) {
          kelas += " aktif";
        } else if (sudahDijawab) {
          kelas += " terjawab";
        }
        return `<button type="button" class="${kelas}" onclick="lompatKeSoal(${idx})">${s.no}</button>`;
      }).join('');
    }

    function cekApakahSudahDijawab(soal) {
      const val = jawabanTersimpan[soal.no];
      if (!val) return false;
      if (soal.tipe === 'BS') {
        return val.split(',').some(item => item === 'B' || item === 'S');
      }
      return val.trim() !== "";
    }

    function simpanJawabanSoalAktif() {
      if (!daftarSoalGlobal.length) return;
      const s = daftarSoalGlobal[indexSoalAktif];
      const tipe = s.tipe || 'PG';
      const hurufOpsi = ['a', 'b', 'c', 'd', 'e'];

      if (tipe === 'PG') {
        const terpilih = document.querySelector(`input[name="soal_${s.no}"]:checked`);
        jawabanTersimpan[s.no] = terpilih ? terpilih.value : "";
      } 
      else if (tipe === 'PGK') {
        const terpilih = Array.from(document.querySelectorAll(`input[name="soal_${s.no}"]:checked`)).map(el => el.value);
        jawabanTersimpan[s.no] = terpilih.join(',');
      } 
      else if (tipe === 'BS') {
        const hasilBS = [];
        hurufOpsi.forEach((h, idx) => {
          if (s[h]) {
            const terpilih = document.querySelector(`input[name="soal_${s.no}_item_${idx}"]:checked`);
            hasilBS.push(terpilih ? terpilih.value : "-");
          }
        });
        jawabanTersimpan[s.no] = hasilBS.join(',');
      }
    }

    function pindahSoal(arah) {
      simpanJawabanSoalAktif();
      const targetIndex = indexSoalAktif + arah;
      if (targetIndex >= 0 && targetIndex < daftarSoalGlobal.length) {
        tampilkanSoal(targetIndex);
      }
    }

    function lompatKeSoal(idx) {
      simpanJawabanSoalAktif();
      tampilkanSoal(idx);
    }

    function tampilkanSoal(idx) {
      indexSoalAktif = idx;
      const s = daftarSoalGlobal[idx];
      const totalSoal = daftarSoalGlobal.length;
      const tipe = s.tipe || 'PG';
      const hurufOpsi = ['a', 'b', 'c', 'd', 'e'];
      const nilaiTersimpan = jawabanTersimpan[s.no] || "";

      let kontenOpsi = '';
      let badgeHTML = '';

      if (tipe === 'PG') {
        badgeHTML = `<span class="badge-tipe badge-pg">Pilihan Ganda (Pilih 1)</span>`;
        kontenOpsi = hurufOpsi.map(h => {
          if (!s[h]) return '';
          const H = h.toUpperCase();
          const checked = (nilaiTersimpan === H) ? 'checked' : '';
          return `
            <label class="opsi-label">
              <input type="radio" name="soal_${s.no}" value="${H}" ${checked} onchange="simpanJawabanSoalAktif(); renderGridNavigasi();">
              <div class="opsi-konten"><b>${H}.</b> ${formatKontenMedia(s[h])}</div>
            </label>`;
        }).join('');
      } 
      else if (tipe === 'PGK') {
        badgeHTML = `<span class="badge-tipe badge-pgk">Pilihan Ganda Kompleks (Lebih Dari 1)</span>`;
        const arrayTerpilih = nilaiTersimpan.split(',');
        kontenOpsi = hurufOpsi.map(h => {
          if (!s[h]) return '';
          const H = h.toUpperCase();
          const checked = arrayTerpilih.includes(H) ? 'checked' : '';
          return `
            <label class="opsi-label">
              <input type="checkbox" name="soal_${s.no}" value="${H}" ${checked} onchange="simpanJawabanSoalAktif(); renderGridNavigasi();">
              <div class="opsi-konten"><b>${H}.</b> ${formatKontenMedia(s[h])}</div>
            </label>`;
        }).join('');
      } 
      else if (tipe === 'BS') {
        badgeHTML = `<span class="badge-tipe badge-bs">Pilihan Ganda Kompleks (Benar / Salah)</span>`;
        const arrayBS = nilaiTersimpan.split(',');
        const barisPernyataan = hurufOpsi.map((h, i) => {
          if (!s[h]) return '';
          const cekB = (arrayBS[i] === 'B') ? 'checked' : '';
          const cekS = (arrayBS[i] === 'S') ? 'checked' : '';
          return `
            <tr>
              <td>${formatKontenMedia(s[h])}</td>
              <td class="tengah"><input type="radio" name="soal_${s.no}_item_${i}" value="B" ${cekB} onchange="simpanJawabanSoalAktif(); renderGridNavigasi();"></td>
              <td class="tengah"><input type="radio" name="soal_${s.no}_item_${i}" value="S" ${cekS} onchange="simpanJawabanSoalAktif(); renderGridNavigasi();"></td>
            </tr>`;
        }).join('');

        kontenOpsi = `
          <table class="tabel-bs">
            <thead>
              <tr>
                <th style="text-align:left;">Pernyataan</th>
                <th>Benar</th>
                <th>Salah</th>
              </tr>
            </thead>
            <tbody>${barisPernyataan}</tbody>
          </table>`;
      }

      document.getElementById("wadah-soal").innerHTML = `
        <div class="header-nomor-soal">
          <span class="nomor-besar">Soal No. ${s.no} dari ${totalSoal}</span>
          ${badgeHTML}
        </div>
        <div style="font-size:16px; color:#0f172a; line-height:1.55; margin-bottom:14px;">
          <b>${s.no}.</b> ${formatKontenMedia(s.tanya)}
        </div>
        ${kontenOpsi}
      `;

      document.getElementById("btn-sebelumnya").disabled = (idx === 0);

      if (idx === totalSoal - 1) {
        document.getElementById("btn-berikutnya").style.display = "none";
        document.getElementById("btn-selesai").style.display = "inline-block";
      } else {
        document.getElementById("btn-berikutnya").style.display = "inline-block";
        document.getElementById("btn-selesai").style.display = "none";
      }

      renderGridNavigasi();
    }

    function kembaliKeHalamanLogin() {
      hentikanPengawasanAktif();
      userAktif = "";
      daftarSoalGlobal = [];
      jawabanTersimpan = {};
      
      document.getElementById("wadah-soal").innerHTML = "";
      document.getElementById("password").value = "";
      document.getElementById("halaman-ujian").style.display = "none";
      document.getElementById("panel-navigasi").style.display = "none";
      document.getElementById("halaman-login").style.display = "block";

      setTimeout(() => {
        try {
          if (document.fullscreenElement) {
            document.exitFullscreen().catch(() => {});
          }
        } catch (e) {}
      }, 150);
    }

    async function tanganiPelanggaran(alasan) {
      if (!ujianBerjalan || sedangProsesLogout) return;
      sedangProsesLogout = true;
      hentikanPengawasanAktif();

      const pelanggaranKe = jumlahPelanggaranSaatIni + 1;
      if (pelanggaranKe === 1) {
        simpanJawabanSoalAktif();
      }
      const jawabanSekarang = pelanggaranKe === 1 ? { ...jawabanTersimpan } : {};
      const idPelanggar = userAktif;

      kembaliKeHalamanLogin();

      setTimeout(() => {
        if (pelanggaranKe === 1) {
          Swal.fire({
            icon: 'warning',
            title: 'PERINGATAN PELANGGARAN KE-1!',
            html: `Anda terdeteksi: <b>${alasan}</b>.<br><br>Sesi Anda telah dikeluarkan otomatis ke halaman login, namun <b>jawaban Anda MASIH TERSIMPAN</b>.<br>Silakan login kembali. <b>Jika melanggar ke-2 kalinya, seluruh jawaban Anda akan DIHAPUS!</b>`,
            confirmButtonText: 'Mengerti',
            confirmButtonColor: '#d97706',
            allowOutsideClick: false
          });
        } else {
          Swal.fire({
            icon: 'error',
            title: 'PELANGGARAN KE-' + pelanggaranKe + '!',
            html: `Anda kembali terdeteksi: <b>${alasan}</b>.<br><br>Sesi Anda dikeluarkan otomatis ke halaman login dan <b>SELURUH JAWABAN ANDA TELAH DIHAPUS!</b>`,
            confirmButtonText: 'Login Ulang',
            confirmButtonColor: '#dc2626',
            allowOutsideClick: false
          });
        }
      }, 250);

      try {
        await panggilGAS({
          aksi: "PELANGGARAN",
          userId: idPelanggar,
          keterangan: alasan,
          jawaban: jawabanSekarang
        });
      } catch (err) {
        console.error("Gagal mencatat pelanggaran:", err);
      } finally {
        sedangProsesLogout = false;
      }
    }

    // Event listener tambahan untuk deteksi instan
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && ujianBerjalan) {
        tanganiPelanggaran("Berpindah tab, membuka aplikasi lain, atau layar terbagi");
      }
    });

    window.addEventListener("blur", () => {
      if (!ujianBerjalan) return;
      timerBlur = setTimeout(() => {
        if (!document.hasFocus() && ujianBerjalan) {
          tanganiPelanggaran("Jendela browser kehilangan fokus");
        }
      }, 1200);
    });

    window.addEventListener("focus", () => {
      if (timerBlur) {
        clearTimeout(timerBlur);
        timerBlur = null;
      }
    });

    document.addEventListener("fullscreenchange", () => {
      if (!document.fullscreenElement && ujianBerjalan && !isMobile) {
        tanganiPelanggaran("Keluar dari mode Fullscreen");
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "F12" || (e.ctrlKey && e.shiftKey && e.key === "I") || (e.ctrlKey && e.key === "u")) {
        e.preventDefault();
        tanganiPelanggaran("Mencoba membuka Inspect Element / Source Code");
      }
    });

    function konfirmasiKirim() {
      simpanJawabanSoalAktif();
      const belumDijawab = daftarSoalGlobal.filter(s => !cekApakahSudahDijawab(s)).length;
      const pesanTambahan = belumDijawab > 0 
        ? `<br><br><span style="color:#dc2626; font-weight:bold;">Perhatian: Masih ada ${belumDijawab} soal yang belum dijawab!</span>` 
        : '';

      Swal.fire({
        title: 'Kirim Jawaban Sekarang?',
        html: `Anda tidak dapat mengubah jawaban setelah dikirim.${pesanTambahan}`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonColor: '#16a34a',
        cancelButtonColor: '#64748b',
        confirmButtonText: 'Ya, Kirim Jawaban!',
        cancelButtonText: 'Batal'
      }).then((result) => {
        if (result.isConfirmed) prosesKirimJawaban();
      });
    }

    async function prosesKirimJawaban() {
      hentikanPengawasanAktif();
      Swal.fire({ title: 'Menyimpan & Mengoreksi Jawaban...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

      const hasil = await panggilGAS({ aksi: "SUBMIT", userId: userAktif, jawaban: jawabanTersimpan });
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});

      Swal.fire({
        icon: 'success',
        title: 'Ujian Selesai!',
        html: `Jawaban Anda berhasil direkam.<br>Skor Akhir Anda: <b style="font-size:26px; color:#16a34a;">${hasil.skor}</b>`,
        confirmButtonText: 'Tutup'
      });

      document.getElementById("halaman-ujian").innerHTML = `
        <div style="text-align:center; padding: 30px;">
          <h2>Ujian Telah Selesai</h2>
          <p style="color:#475569;">Terima kasih telah mengikuti ujian dengan jujur.</p>
          <p style="font-size: 22px; margin-top: 20px;">Skor Akhir Anda: <b style="color:#16a34a;">${hasil.skor}</b></p>
        </div>
      `;
    }
  </script>
</body>
</html>
